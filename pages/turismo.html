<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>Turismo - Diomede Luxury</title>
    <meta name="theme-color" content="#F0EDE9">
    <link rel="manifest" href="../manifest.json">
    <link rel="apple-touch-icon" href="../logo.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=PT+Serif:wght@400;700&family=Open+Sans:wght@400;600&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,200,0,0&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-accent: #A39689;
            --bg-color: #F0EDE9;
            --text-dark: #1a1a1a;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Open Sans', sans-serif; margin: 0; background-color: var(--bg-color); color: var(--text-dark); line-height: 1.4; text-align: center; }

        /* LINGUA */
        .lang-switcher { position: absolute; top: 15px; right: 15px; display: flex; gap: 8px; z-index: 100; }
        .lang-btn {
            width: 35px; height: 35px; border-radius: 50%; border: 1px solid rgba(0,0,0,0.1);
            background: rgba(255,255,255,0.6); font-size: 10px; font-weight: bold;
            display: flex; align-items: center; justify-content: center; cursor: pointer; backdrop-filter: blur(5px);
        }
        .lang-btn.active { background: var(--primary-accent); color: white; border-color: var(--primary-accent); }

        /* HEADER */
        .hero-header { width: 100%; height: 240px; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
        .logo-img { width: 100%; max-width: 300px; z-index: 5; }
        .hero-overlay { position: absolute; bottom: 0; left: 0; width: 100%; height: 60px; background: linear-gradient(to top, var(--bg-color), transparent); }

        /* GRID */
        .container { width: 100%; max-width: 900px; margin: -30px auto 0; padding: 0 20px 80px; position: relative; z-index: 10; }
        h2 { font-family: 'PT Serif', serif; font-size: 34px; color: #2c2c2c; }
        .divider { width: 50px; height: 1px; background-color: var(--primary-accent); margin: 10px auto 30px; }
        
        .destinations-grid { display: grid; grid-template-columns: 1fr; gap: 12px; text-align: left; }
        @media (min-width: 768px) { .destinations-grid { grid-template-columns: 1fr 1fr; } }

        .destination-card {
            background-color: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(163, 150, 137, 0.3);
            border-radius: 15px; padding: 20px; display: flex; flex-direction: column;
        }
        .dest-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .dest-header h3 { font-family: 'PT Serif', serif; font-size: 20px; margin: 0; }
        .distance-tag { font-size: 9px; background: var(--primary-accent); padding: 4px 10px; border-radius: 50px; color: white; font-weight: 700; }
        .dest-description { font-size: 13px; margin-bottom: 15px; flex-grow: 1; }

        .maps-btn {
            display: inline-flex; align-items: center; background: white; border: 1px solid var(--primary-accent);
            border-radius: 10px; padding: 8px 15px; text-decoration: none; color: var(--text-dark);
            font-size: 10px; font-weight: 700; text-transform: uppercase; width: fit-content;
        }
        .maps-btn:active { background: var(--primary-accent); color: white; }

        /* BACK */
        .back-btn {
            display: inline-flex; align-items: center; background: var(--primary-accent); color: white;
            text-decoration: none; padding: 16px 40px; border-radius: 50px; font-size: 12px; font-weight: 700;
            margin-top: 50px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
    </style>

<style id="diomede-global-back-style">
.diomede-global-back{
    position:fixed;
    top:max(16px, env(safe-area-inset-top));
    left:16px;
    width:38px;
    height:38px;
    border-radius:50%;
    border:1px solid #A39689;
    background:#A39689;
    color:#ffffff;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:9999;
    cursor:pointer;
    -webkit-backdrop-filter:blur(10px);
    backdrop-filter:blur(10px);
    box-shadow:0 4px 14px rgba(0,0,0,.08);
    transition:transform .18s ease, background .18s ease;
    padding:0;
}
.diomede-global-back:active{
    transform:scale(.94);
    background:#8D8378;
}
.diomede-global-back .material-symbols-outlined{
    font-size:20px;
    line-height:1;
    font-variation-settings:'wght' 300;
}
@media (max-width:480px){
    .diomede-global-back{
        top:max(14px, env(safe-area-inset-top));
        left:14px;
        width:36px;
        height:36px;
    }
}
</style>

</head>
<body>

<button type="button" class="diomede-global-back" aria-label="Torna alla pagina precedente" title="Indietro" onclick="diomedeGoBack()">
    <span class="material-symbols-outlined">arrow_back_ios_new</span>
</button>


    <div class="lang-switcher">
        <div id="btn-it" class="lang-btn" onclick="setLanguage('it')">ITA</div>
        <div id="btn-en" class="lang-btn" onclick="setLanguage('en')">ENG</div>
    </div>

    <div class="hero-header">
        <img src="../assets/images/header.png" alt="Logo" class="logo-img">
        <div class="hero-overlay"></div>
    </div>

    <div class="container">
        <h2 data-it="Esplora il Territorio" data-en="Explore the Area">Esplora il Territorio</h2>
        <div class="divider"></div>

        <div id="destinations-grid" class="destinations-grid">
            </div>

        <a href="menu.html" class="back-btn">
            <span class="material-symbols-outlined" style="margin-right:10px; font-size:16px;">arrow_back_ios_new</span>
            <span data-it="Torna alla home" data-en="Back to home">Torna alla home</span>
        </a>
    </div>

    <script>
        // CONFIGURAZIONE DESTINAZIONI: Aggiungile qui facilmente
        const DESTINATIONS = [
            {
                name: "Brindisi",
                time: "0 min",
                it: "Il porto naturale, la scalinata monumentale e le Colonne Romane.",
                en: "The natural harbor, the monumental staircase, and the Roman Columns.",
                link: "https://www.google.com/maps/search/?api=1&query=Brindisi+Centro"
            },
            {
                name: "Mesagne",
                time: "15 min",
                it: "Il centro storico a forma di cuore e l'imponente Castello Svevo.",
                en: "The heart-shaped historic center and the imposing Swabian Castle.",
                link: "https://www.google.com/maps/search/?api=1&query=Castello+Svevo+Mesagne"
            },
            {
                name: "Torre Guaceto",
                time: "20 min",
                it: "Oasi protetta con spiagge selvagge e acque cristalline.",
                en: "Protected oasis with wild beaches and crystal-clear waters.",
                link: "https://www.google.com/maps/search/?api=1&query=Riserva+Naturale+Torre+Guaceto"
            },
            {
                name: "Lecce",
                time: "30 min",
                it: "La 'Firenze del Sud', trionfo del Barocco e dell'arte.",
                en: "The 'Florence of the South', a triumph of Baroque art and architecture.",
                link: "https://www.google.com/maps/search/?api=1&query=Lecce+Centro"
            }
        ];

        function renderDestinations(lang) {
            const grid = document.getElementById('destinations-grid');
            grid.innerHTML = '';
            
            DESTINATIONS.forEach(dest => {
                grid.innerHTML += `
                    <div class="destination-card">
                        <div class="dest-header">
                            <h3>${dest.name}</h3>
                            <span class="distance-tag">${dest.time}</span>
                        </div>
                        <p class="dest-description">${dest[lang]}</p>
                        <a href="${dest.link}" target="_blank" class="maps-btn">
                            <span class="material-symbols-outlined" style="margin-right: 6px; font-size: 16px;">location_on</span>
                            <span>${lang === 'it' ? 'Posizione' : 'Location'}</span>
                        </a>
                    </div>
                `;
            });
        }

        function setLanguage(lang) {
            localStorage.setItem('preferredLang', lang);
            document.getElementById('btn-it').classList.toggle('active', lang === 'it');
            document.getElementById('btn-en').classList.toggle('active', lang === 'en');

            document.querySelectorAll('[data-it]').forEach(el => {
                el.textContent = el.getAttribute('data-' + lang);
            });
            
            renderDestinations(lang);
        }

        window.onload = () => {
            const savedLang = localStorage.getItem('preferredLang') || 'it';
            setLanguage(savedLang);
        };
    </script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('../sw.js'));
}
</script>

<script id="diomede-global-back-script">
function diomedeGoBack(){
    if (window.history.length > 1) {
        window.history.back();
    } else {
        const path = window.location.pathname;
        if (path.includes('/pages/istruzioni/')) {
            window.location.href = '../istruzioni.html';
        } else if (path.includes('/pages/')) {
            window.location.href = 'menu.html';
        } else {
            window.location.href = 'pages/menu.html';
        }
    }
}
</script>

</body>
</html>
