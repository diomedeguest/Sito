<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover>
    <title>Welcome - Diomede Luxury</title>
    <meta name="theme-color" content="#000000">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="logo.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=PT+Serif:wght@400;700&family=Open+Sans:wght@300;400;600&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,200,0,0&display=swap" rel="stylesheet">
    
    <style>
        /* Reset e Base */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body, html { 
            height: 100%; margin: 0; padding: 0; 
            font-family: 'Open Sans', sans-serif; 
            background-color: #000; 
            overflow: hidden; 
        }

        /* --- 1. Splash Screen --- */
        #splash-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999; 
            animation: fadeOutSplash 1s ease-in-out 2.5s forwards;
        }

        .splash-logo {
            width: 180px; height: auto;
            opacity: 0;
            animation: 
                logoEntrata 0.8s ease-out 0.2s forwards, 
                logoPulsazione 1.5s ease-in-out 1s infinite; 
        }

        /* --- 2. Main Content --- */
        #main-content {
            height: 100%; width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            animation: fadeInMain 1s ease-in-out 3s forwards;
        }

        .bg-image { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: linear-gradient(rgba(0,0,0,0.2), rgba(0,0,0,0.3)), url('logo_start.png') no-repeat center center; 
            background-size: cover; 
            z-index: 1; 
            animation: slowZoom 20s infinite alternate linear; 
        }

        .white-box { 
            position: relative; 
            z-index: 2; 
            background-color: rgba(255, 255, 255, 0.98); 
            width: 88%; 
            max-width: 380px; 
            padding: 34px 28px 36px; 
            text-align: center; 
            box-shadow: 0 30px 60px rgba(0,0,0,0.4); 
            display: flex; flex-direction: column; align-items: center; 
            border-radius: 2px;
        }

        /* --- 3. Elementi e Animazioni --- */
        .logo-inner, .title-container, .divider, .subtitle, .tagline, .enter-btn {
            opacity: 0;
            animation: fadeInUp 0.8s ease forwards;
        }

        .logo-inner { width: 118px; max-height: 92px; object-fit: contain; height: auto; margin-bottom: 20px; animation-delay: 3.4s; }
        .title-text { font-family: 'PT Serif', serif; font-size: 38px; color: #000; margin: 0; line-height: 1.1; letter-spacing: -0.5px; }
        .title-container { animation-delay: 3.6s; }
        
        .divider { 
            width: 40px; height: 1px; background-color: #000; margin: 18px auto; 
            animation: scaleDivider 0.8s ease forwards;
            animation-delay: 3.8s;
        }

        .subtitle { font-family: 'PT Serif', serif; font-size: 18px; color: #000; margin-bottom: 8px; animation-delay: 4.0s; }
        .tagline { font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px; color: #666; margin-bottom: 28px; animation-delay: 4.2s; }
        .enter-btn { animation-delay: 4.4s; }

        /* Keyframes */
        @keyframes logoEntrata { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
        @keyframes logoPulsazione { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
        @keyframes fadeOutSplash { from { opacity: 1; visibility: visible; } to { opacity: 0; visibility: hidden; } }
        @keyframes fadeInMain { to { opacity: 1; } }
        @keyframes slowZoom { from { transform: scale(1); } to { transform: scale(1.1); } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes scaleDivider { from { opacity: 0; transform: scaleX(0); } to { opacity: 1; transform: scaleX(1); } }

        /* Bottone */
        .enter-btn { 
            display: inline-flex; align-items: center; justify-content: center; 
            padding: 16px 45px; background-color: #000; color: #fff;
            text-decoration: none; text-transform: uppercase; 
            font-size: 11px; font-weight: 700; letter-spacing: 2px; 
            border-radius: 50px; transition: all 0.3s ease; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .enter-btn span { margin-right: 10px; font-size: 18px; }
        .enter-btn:active { transform: scale(0.95); background-color: #222; }
    
        @media (max-height: 700px) {
            .white-box { padding: 24px 24px 26px; }
            .logo-inner { width: 96px; max-height: 72px; margin-bottom: 14px; }
            .title-text { font-size: 34px; }
            .divider { margin: 13px auto; }
            .tagline { margin-bottom: 20px; }
            .enter-btn { padding: 13px 38px; }
        }
    </style>
</head>
<body>
<div id="splash-screen">
        <img src="logo.png" alt="Diomede Luxury Splash" class="splash-logo">
    </div>

    <div id="main-content">
        <div class="bg-image"></div>
        <div class="white-box">
            <img src="logo.png" alt="Diomede Luxury Logo" class="logo-inner">
            <div class="title-container">
                <h1 class="title-text">Welcome Guide</h1>
            </div>
            <div class="divider"></div>
            <div class="subtitle">Diomede Luxury Apartment</div>
            <div class="tagline">Sentitevi a casa</div>
            <a href="pages/menu.html" class="enter-btn">
                <span class="material-symbols-outlined">login</span>
                Entra
            </a>
        </div>
    </div>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
}
</script>

<script id="diomede-orientation-unlock">
(function () {
    function unlockOrientation() {
        try {
            if (screen.orientation && typeof screen.orientation.unlock === 'function') {
                screen.orientation.unlock();
            }
        } catch (e) {
            /* Browser/device may not expose the Screen Orientation API. */
        }
    }
    window.addEventListener('DOMContentLoaded', unlockOrientation);
    window.addEventListener('pageshow', unlockOrientation);
})();
</script>

</body>
</html>
